[package]
name = "libpafos"
version = "0.1.0"
edition = "2024"

[dependencies]
pafos-abi = { path = "../abi" }
linked_list_allocator = { version = "0.9.0", optional = true }

[features]
# Runtime for programs: `_start`, `exit`, panic handler and a heap. Every
# program enables it; the kernel's tests use libpafos without it (the
# kernel has its own panic handler and allocator).
rt = ["dep:linked_list_allocator"]

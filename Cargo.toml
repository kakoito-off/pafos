[package]
name = "pafos"
version = "0.1.0"
authors = ["Philipp Oppermann <dev@phil-opp.com>"]
edition = "2024"

[workspace]
members = ["abi", "libpafos", "programs/*", "programs/calc/eval"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
pafos-abi = { path = "abi" }

# Programs: every folder in programs/ is one, and its feature here (same name)
# puts it into the image. build.rs finds and builds them; the kernel's code
# never names a program. `cargo build --no-default-features` gives a kernel
# with no programs at all, which boots to a blank screen.
[features]
default = ["shell", "calc", "time", "timer", "fault", "zeros"]
shell = []
calc = []
time = []
timer = []
fault = []
zeros = []

# The kernel itself never uses libpafos; tests do, to go through system calls
# exactly like a program would.
[dev-dependencies]
libpafos = { path = "libpafos" }
pafos-calc-eval = { path = "programs/calc/eval" }

[build-dependencies]
pafos-abi = { path = "abi" }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "pafos"
test = true
bench = false


[package.metadata.bootimage]
test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33 # (0x10 << 1) | 1

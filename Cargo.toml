[package]
name = "pafos"
version = "0.1.0"
authors = ["Philipp Oppermann <dev@phil-opp.com>"]
edition = "2024"

[workspace]
members = ["abi", "libpafos", "programs/*"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
pafos-abi = { path = "abi" }
pafos-shell = { path = "programs/shell", optional = true }

# Every program is optional; `cargo build --no-default-features` gives a
# kernel with no programs at all, which boots to a blank screen.
# The shell is linked into the kernel and runs in ring 0; every other
# program is a separate executable run in ring 3 (built by build.rs).
[features]
default = ["shell", "calc", "time", "timer", "fault"]
shell = ["dep:pafos-shell"]
calc = []
time = []
timer = []
fault = []

# The kernel itself never uses libpafos; tests do, to go through system calls
# exactly like a program would.
[dev-dependencies]
libpafos = { path = "libpafos" }
# Only the evaluator library, to test it directly.
pafos-calc = { path = "programs/calc" }

[build-dependencies]
pafos-abi = { path = "abi" }

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "pafos"
test = true
bench = false


[package.metadata.bootimage]
test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33 # (0x10 << 1) | 1
